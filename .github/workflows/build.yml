name: Build and publish lists

on:
  schedule:
    # Mondays 03:17 UTC, off the hour to spread load on the endpoints.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitee refuses a push from a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          git add -A sites
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rebuild the known-sites list"
          git push
      - name: Mirror to Gitee
        # Gitee is the mirror BetterSearch tries first in mainland China.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        if: env.GITEE_TOKEN != ''
        run: git push --force "https://R3less:${GITEE_TOKEN}@gitee.com/R3less/bettersearch-rules.git" HEAD:main
