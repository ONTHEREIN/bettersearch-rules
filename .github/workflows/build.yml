name: Build and publish lists

on:
  schedule:
    # Mondays 03:17 UTC, off the hour to spread load on the endpoints.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  # npm trusted publishing: the registry accepts this workflow's OIDC token.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node scripts/build.mjs
      - name: Commit if changed
        id: commit
        run: |
          git add -A sites
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rebuild the known-sites list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # A version per build; npmmirror and jsDelivr serve `latest`.
          npm version --no-git-tag-version "0.1.$(date -u +%Y%m%d%H%M)"
          npm publish --provenance --access public
      - name: Ask npmmirror to sync now
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: curl -fsS -X PUT https://registry-direct.npmmirror.com/-/package/bettersearch-rules/syncs > /dev/null || true
